<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helith - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f9fc;
            --surface-color: #ffffff;
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --accent-color: #a3bffa;
            --accent-hover: #8aaef9;
            --error-color: #feb2b2;
            --error-text: #c53030;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: var(--surface-color);
            padding: 3rem 4rem;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.03);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 2rem;
            letter-spacing: -0.02em;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        input[type="password"] {
            width: 100%;
            padding: 1rem 1.2rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
            background-color: #f8fafc;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: var(--accent-color);
            background-color: var(--surface-color);
            box-shadow: 0 0 0 4px rgba(163, 191, 250, 0.2);
        }

        button {
            width: 100%;
            padding: 1rem;
            background-color: var(--accent-color);
            color: #1a202c;
            border: none;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: translateY(2px);
        }

        .error-message {
            background-color: var(--error-color);
            color: var(--error-text);
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>Helith</h1>
        <p>Métricas y telemetría de red</p>

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="input-group">
                <input type="password" name="password" placeholder="Contraseña de acceso" required autofocus>
            </div>
            <button type="submit">Acceder al Dashboard</button>
        </form>
    </div>

</body>
</html>
